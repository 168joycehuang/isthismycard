<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智慧排課助手</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --fg: #1f2328;
      --muted: #5c6670;
      --primary: #2563eb;
      --primary-fg: #ffffff;
      --danger: #d12f2f;
      --warn: #c7700a;
      --ok: #197a3d;
      --border: #d6dae0;
      --focus: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15181c;
        --surface: #1e2228;
        --fg: #e7eaee;
        --muted: #9aa4af;
        --primary: #5b8def;
        --primary-fg: #0b0e12;
        --danger: #ff6b6b;
        --warn: #e8a13a;
        --ok: #52c27a;
        --border: #343a42;
        --focus: #7aa6ff;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.5;
      font-size: 16px;
      overflow-x: hidden;
    }
    header, main, footer { max-width: 1100px; margin: 0 auto; padding: 12px 16px; }
    header { border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.25rem; margin: 4px 0 10px; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    h3 { font-size: 1rem; margin: 14px 0 8px; }
    a { color: var(--primary); }
    .muted { color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    .col { flex: 1 1 220px; min-width: 0; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.92rem; }
    input, select, button, textarea {
      font: inherit; color: inherit;
    }
    input[type="text"], input[type="number"], input[type="search"], select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface); color: var(--fg);
    }
    input[type="file"] { color: var(--fg); }
    button {
      min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface); color: var(--fg);
      cursor: pointer;
    }
    button.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    button.danger { color: var(--danger); border-color: var(--danger); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.small { min-height: 36px; min-width: 36px; padding: 4px 10px; font-size: 0.85rem; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .toolbar .spacer { flex: 1 1 auto; }

    /* Stepper */
    .stepper { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 10px 0 0; }
    .stepper li { flex: 1 1 120px; }
    .stepper button {
      width: 100%; text-align: left; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface); font-size: 0.9rem; padding: 8px 10px;
    }
    .stepper button[aria-current="step"] { border-color: var(--primary); border-width: 2px; font-weight: 700; }
    .stepper button[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
    .stepper .done::before { content: "✔ "; color: var(--ok); }
    .step-no { display: inline-block; font-weight: 700; margin-right: 4px; }

    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; font-size: 0.9rem; }
    th { background: color-mix(in srgb, var(--border) 40%, transparent); }
    .scroll-x { overflow-x: auto; }

    .msg { padding: 8px 10px; border-radius: 8px; margin: 6px 0; font-size: 0.92rem; }
    .msg.error { color: var(--danger); border: 1px solid var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
    .msg.warn { color: var(--warn); border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
    .msg.ok { color: var(--ok); border: 1px solid var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }
    .banner { font-weight: 600; }

    .progress-line { margin: 6px 0; }
    .progress-line .bar { height: 10px; background: var(--border); border-radius: 6px; overflow: hidden; }
    .progress-line .bar > span { display: block; height: 100%; background: var(--primary); }
    .progress-line .label { font-size: 0.88rem; }

    #toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px;
      max-width: 90vw; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 50;
    }
    #toast.show { opacity: 1; }

    dialog { border: 1px solid var(--border); border-radius: 10px; padding: 18px; max-width: 90vw; width: 420px; color: var(--fg); background: var(--surface); }
    dialog::backdrop { background: rgba(0,0,0,0.4); }

    /* 週課表 */
    .timetable td.has-course { background: color-mix(in srgb, var(--primary) 18%, transparent); font-size: 0.78rem; }
    .timetable td.conflict { border: 2px solid var(--danger); background: color-mix(in srgb, var(--danger) 18%, transparent); }
    .timetable th, .timetable td { text-align: center; min-width: 70px; }

    .list-item { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .list-item .grow { flex: 1 1 160px; min-width: 0; }
    .tag { font-size: 0.78rem; padding: 1px 6px; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); }
    .selftest-banner { background: var(--surface); border: 2px solid var(--border); border-radius: 10px; padding: 10px; margin: 10px auto; max-width: 1100px; }

    @media print {
      header .toolbar, .stepper, button, dialog, #toast, .no-print { display: none !important; }
      body { background: #fff; color: #000; }
      .card { border-color: #999; }
    }
  </style>
</head>

  <header>

    <div class="toolbar" role="toolbar" aria-label="工具列">

    <section id="summary" hidden tabindex="-1" aria-labelledby="summary-h"></section>

  <footer>
    <p class="muted" id="footer-text"></p>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

    </form>
  </dialog>

  function $(sel, root) { return (root || document).querySelector(sel); }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v == null || v === false) return;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k === "dataset") { Object.keys(v).forEach(function (dk) { node.dataset[dk] = v[dk]; }); }

        else if (k === "for") node.htmlFor = v;
        else if (v === true) node.setAttribute(k, "");
        else node.setAttribute(k, v);
      });
    }
    appendChildren(node, children);
    return node;
  }
  function appendChildren(node, children) {

  }
  function defaultSemester(date) {
    var d = date instanceof Date ? date : new Date(date);
    var m = d.getMonth() + 1;
    return (m >= 8 || m === 1) ? 1 : 2;
  }
  function calcEntryYear(academicYear, grade) { return academicYear - grade + 1; }

  function pickCurriculum(dept, entryYear) {
    var curr = dept && dept.curricula ? dept.curricula : {};
    var years = Object.keys(curr).map(function (y) { return parseInt(y, 10); });
    if (years.length === 0) return null;
    if (curr[String(entryYear)]) return { curriculum: curr[String(entryYear)], usedYear: entryYear, fallback: false };
    years.sort(function (a, b) {
      var da = Math.abs(a - entryYear), db = Math.abs(b - entryYear);
      if (da !== db) return da - db;
      return a - b;
    });
    var used = years[0];
    return { curriculum: curr[String(used)], usedYear: used, fallback: true };
  }

  function buildAutoHistory(curriculum, courses, currentTerm) {
    var byCode = {};
    courses.forEach(function (c) { byCode[c.code] = c; });
    var items = [];
    termsBefore(currentTerm).forEach(function (term) {
      var codes = (curriculum.requiredByTerm && curriculum.requiredByTerm[term]) || [];
      codes.forEach(function (code) {
        var c = byCode[code];
        if (!c) return;
        items.push({ id: uid(), code: c.code, name: c.name, credits: c.credits, term: term, category: c.category, status: "passed", source: "auto" });
      });
    });
    return items;
  }

  function buildAutoPlan(curriculum, courses, currentTerm, historyItems) {
    var byCode = {};
    courses.forEach(function (c) { byCode[c.code] = c; });
    var doneCodes = {};
    (historyItems || []).forEach(function (h) { if (STATUS_COUNTED[h.status]) doneCodes[h.code] = true; });
    var codes = (curriculum.requiredByTerm && curriculum.requiredByTerm[currentTerm]) || [];
    var items = [];
    codes.forEach(function (code) {
      if (doneCodes[code]) return;
      var c = byCode[code];
      if (!c) return;
      items.push({ code: c.code, name: c.name, credits: c.credits, category: c.category, slots: c.slots.slice(), source: "auto" });
    });
    return items;
  }

  function computeProgress(requirements, historyItems) {
    var min = {};
    (requirements.groups || []).forEach(function (g) { min[g.id] = g.minCredits; });
    var seen = {};
    var counted = [];
    (historyItems || []).forEach(function (h) {
      if (!STATUS_COUNTED[h.status]) return;
      if (seen[h.code]) return;
      seen[h.code] = true;
      counted.push(h);
    });
    var earned = { required: 0, elective: 0, general: 0, free: 0 };
    counted.forEach(function (h) {
      if (earned[h.category] == null) earned[h.category] = 0;
      earned[h.category] += h.credits;
    });
    var overflowElective = Math.max(0, earned.elective - (min.elective || 0));
    var overflowGeneral = Math.max(0, earned.general - (min.general || 0));
    var effective = {
      required: earned.required,
      elective: Math.min(earned.elective, min.elective || 0),
      general: Math.min(earned.general, min.general || 0),
      free: earned.free + overflowElective + overflowGeneral
    };
    function groupStat(g) {
      return { earned: earned[g] || 0, effective: effective[g], min: min[g] || 0, gap: Math.max(0, (min[g] || 0) - effective[g]) };
    }
    var byGroup = {
      required: groupStat("required"),
      elective: groupStat("elective"),
      general: groupStat("general"),
      free: groupStat("free")
    };
    byGroup.free.overflowFrom = { elective: overflowElective, general: overflowGeneral };
    var totalEarned = earned.required + earned.elective + earned.general + earned.free;
    var totalRequired = requirements.totalCredits;
    var totalGap = Math.max(0, totalRequired - totalEarned);

    // 體育門數進度（做法 B）：依 peKind 統計不重複課號的門數
    var pe = null;
    if (requirements.peRequirements) {
      var freshSeen = {}, interestSeen = {};
      (historyItems || []).forEach(function (h) {
        if (!STATUS_COUNTED[h.status]) return;
        if (h.peKind === "pe_freshman") freshSeen[h.code] = true;
        else if (h.peKind === "pe_interest") interestSeen[h.code] = true;
      });
      var freshN = Object.keys(freshSeen).length;
      var interestN = Object.keys(interestSeen).length;
      var fReq = requirements.peRequirements.freshman || 0;
      var iReq = requirements.peRequirements.interest || 0;
      pe = {
        freshman: { earned: freshN, min: fReq, gap: Math.max(0, fReq - freshN) },
        interest: { earned: interestN, min: iReq, gap: Math.max(0, iReq - interestN) }
      };
    }

    return { byGroup: byGroup, totalEarned: totalEarned, totalRequired: totalRequired, totalGap: totalGap, pe: pe };
  }

  function findConflicts(items) {
    var out = [];
    for (var i = 0; i < items.length; i++) {
      for (var j = i + 1; j < items.length; j++) {
        var a = items[i], b = items[j];
        var setA = {};
        (a.slots || []).forEach(function (s) { setA[s] = true; });
        var inter = (b.slots || []).filter(function (s) { return setA[s]; });
        if (inter.length) out.push({ a: a, b: b, slots: inter });
      }
    }
    return out;
  }

  function validatePlan(plan, history, requirements, semester, courses) {
    var errors = [], warnings = [];
    var byCode = {};
    courses.forEach(function (c) { byCode[c.code] = c; });
    var items = plan.items || [];
    findConflicts(items).forEach(function (cf) {
      errors.push("\u2716 \u885d\u5802\uff1a" + cf.a.name + " \u8207 " + cf.b.name + "\uff08" + cf.slots.join("\u3001") + "\uff09");
    });
    var doneCodes = {};
    (history.items || []).forEach(function (h) { if (STATUS_COUNTED[h.status]) doneCodes[h.code] = true; });
    var planCount = {};
    items.forEach(function (it) { planCount[it.code] = (planCount[it.code] || 0) + 1; });
    var seenDup = {};
    items.forEach(function (it) {
      var course = byCode[it.code];
      var prereq = (course && course.prereq) || [];
      var missing = prereq.filter(function (p) { return !doneCodes[p]; });
      if (missing.length) errors.push("\u2716 " + it.name + " \u9700\u5148\u4fee\uff1a" + missing.join("\u3001"));
      if (doneCodes[it.code] || planCount[it.code] > 1) {
        if (!seenDup[it.code]) { errors.push("\u2716 " + it.name + " \u5df2\u4fee\u904e\uff0f\u91cd\u8907\u52a0\u5165"); seenDup[it.code] = true; }
      }
      if (course && course.semesters.indexOf(semester) === -1) {
        errors.push("\u2716 " + it.name + " \u672c\u5b78\u671f\u672a\u958b\u8ab2");
      }
    });
    var total = items.reduce(function (a, it) { return a + it.credits; }, 0);
    var lim = requirements.creditLimits || {};
    if (lim.max != null && total > lim.max) errors.push("\u2716 \u5b78\u5206 " + total + " \u8d85\u904e\u4e0a\u9650 " + lim.max);
    if (lim.min != null && total < lim.min) warnings.push("\u26a0 \u5b78\u5206 " + total + " \u4f4e\u65bc\u4e0b\u9650 " + lim.min);
    return { errors: errors, warnings: warnings };
  }

  // ============================================================
  // 3. Store (state + persistence + subscribe)
  // ============================================================
  function createInitialState() {
    return {
      schemaVersion: SCHEMA_VERSION,
      profile: null,
      curriculum: null,
      requirements: null,
      history: { items: [], confirmed: false },
      plan: { term: null, items: [], submitted: false },
      ui: { step: 1 }
    };
  }

  var storageOK = true;
  var memoryFallback = null;

  function rawLoad() {
    try {
      var s = window.localStorage.getItem(STORAGE_KEY);
      return s;
    } catch (e) {
      storageOK = false;
      return memoryFallback;
    }
  }
  function rawSave(str) {
    try {
      window.localStorage.setItem(STORAGE_KEY, str);
    } catch (e) {
      storageOK = false;
      memoryFallback = str;
    }
  }
  function rawClear() {
    try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) { memoryFallback = null; }
  }

  function load() {
    var s = rawLoad();
    if (!s) return null;
    try {
      var data = JSON.parse(s);
      if (!data || data.schemaVersion !== SCHEMA_VERSION) {
        rawClear();
        return "incompatible";
      }
      return data;
    } catch (e) {
      rawClear();
      return "incompatible";
    }
  }

  var Store = (function () {
    var state = createInitialState();
    var subs = [];
    var persist = debounce(function () { rawSave(JSON.stringify(state)); }, 200);
    return {
      get: function () { return state; },
      set: function (patchFn) {
        patchFn(state);
        persist();
        subs.forEach(function (fn) { fn(state); });
      },
      replace: function (next) {
        state = next;
        persist();
        subs.forEach(function (fn) { fn(state); });
      },
      subscribe: function (fn) { subs.push(fn); return function () { subs = subs.filter(function (f) { return f !== fn; }); }; }
    };
  })();

  // 6.3 步驟解鎖
  function stepUnlocked(state, step) {
    if (step <= 1) return true;
    if (step === 2) return !!state.profile;
    if (step === 3) return !!(state.requirements && state.requirements.confirmed);
    if (step === 4) return !!(state.history && state.history.confirmed);
    if (step === 5) return !!(state.plan && state.plan.submitted);
    return false;
  }
  function stepDone(state, step) {
    if (step === 1) return !!state.profile;
    if (step === 2) return !!(state.requirements && state.requirements.confirmed);
    if (step === 3) return !!(state.history && state.history.confirmed);
    if (step === 4) return !!(state.plan && state.plan.submitted);
    return false;
  }

  function gotoStep(step) {
    var state = Store.get();
    if (!stepUnlocked(state, step)) { toast("\u8acb\u5148\u5b8c\u6210\u524d\u9762\u7684\u6b65\u9a5f"); return; }
    Store.set(function (s) { s.ui.step = step; });
    render();
    var sec = step === 5 ? $("#summary") : $("#step-" + step);
    if (sec) { try { sec.focus(); } catch (e) {} }
  }

  // ============================================================
  // Export / Import / Reset
  // ============================================================
  function doExport() {
    var state = Store.get();
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = el("a", { href: url, download: "scheduler-data-" + todayStr() + ".json" });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast("\u5df2\u532f\u51fa");
  }

  function validateImported(data) {
    if (!data || typeof data !== "object") return false;
    if (data.schemaVersion !== SCHEMA_VERSION) return false;
    if (!("ui" in data) || typeof data.ui !== "object") return false;
    if (!("history" in data) || !Array.isArray(data.history.items)) return false;
    if (!("plan" in data) || !Array.isArray(data.plan.items)) return false;
    return true;
  }

  function doImport(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(String(reader.result));
        if (!validateImported(data)) throw new Error("invalid");
        Store.replace(data);
        render();
        toast("\u5df2\u532f\u5165");
      } catch (e) {
        toast("\u532f\u5165\u5931\u6557\uff1a\u6a94\u6848\u683c\u5f0f\u4e0d\u6b63\u78ba\u6216\u7248\u672c\u4e0d\u76f8\u5bb9\u3002");
      }
    };
    reader.onerror = function () { toast("\u532f\u5165\u5931\u6557\uff1a\u6a94\u6848\u683c\u5f0f\u4e0d\u6b63\u78ba\u6216\u7248\u672c\u4e0d\u76f8\u5bb9\u3002"); };
    reader.readAsText(file);
  }

  function doReset() {
    confirmDialog("\u78ba\u5b9a\u8981\u6e05\u9664\u6240\u6709\u8cc7\u6599\u4e26\u91cd\u65b0\u958b\u59cb\uff1f").then(function (ok) {
      if (!ok) return;
      rawClear();
      Store.replace(createInitialState());
      render();
      toast("\u5df2\u91cd\u8a2d");
    });
  }

  // ============================================================
  // 5. Views
  // ============================================================
  function progressLine(label, earned, min, gap, extraNote) {
    var pct = min > 0 ? Math.min(100, Math.round((Math.min(earned, min) / min) * 100)) : 100;
    var txt = label + " " + earned + " / " + min + "\uff08\u7f3a " + gap + "\uff09" + (extraNote ? "\uff0c" + extraNote : "");
    var bar = el("div", { class: "bar" }, el("span", { style: "width:" + pct + "%" }));
    var wrap = el("div", { class: "progress-line", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(min), "aria-valuenow": String(Math.min(earned, min)), "aria-label": txt },
      [bar, el("div", { class: "label", text: txt })]);
    return wrap;
  }

  function renderStepper() {
    var state = Store.get();
    var ol = $("#stepper");
    clear(ol);
    for (var i = 1; i <= 4; i++) {
      (function (step) {
        var unlocked = stepUnlocked(state, step);
        var done = stepDone(state, step);
        var isCurrent = state.ui.step === step;
        var btn = el("button", {
          type: "button",
          class: done ? "done" : "",
          "aria-current": isCurrent ? "step" : null,
          "aria-disabled": unlocked ? null : "true",
          onclick: function () { if (unlocked) gotoStep(step); }
        }, [el("span", { class: "step-no", text: step + "." }), STEP_NAMES[step - 1]]);
        ol.appendChild(el("li", null, btn));
      })(i);
    }
  }

  function sectionHeading(id, text) {
    return el("h2", { id: id }, text);
  }

  // ---------- Step 1 ----------
  function renderStep1() {
    var sec = $("#step-1");
    clear(sec);
    var state = Store.get();
    var p = state.profile || {};
    var selSchool = p.schoolId || "";
    var selDept = p.deptId || "";
    var selGrade = p.grade || "";
    var selSem = p.semester || defaultSemester(new Date());

    var card = el("div", { class: "card" });
    card.appendChild(sectionHeading("step-1-h", "\u6b65\u9a5f 1\uff1a\u57fa\u672c\u8cc7\u6599"));

    var schoolSel = el("select", { id: "f-school" }, [el("option", { value: "" }, "\u8acb\u9078\u64c7")].concat(
      SEED.schools.map(function (s) { return el("option", { value: s.id, selected: s.id === selSchool }, s.name); })
    ));
    var deptSel = el("select", { id: "f-dept" });
    function fillDept() {
      clear(deptSel);
      deptSel.appendChild(el("option", { value: "" }, "\u8acb\u9078\u64c7"));
      var sc = getSchool(schoolSel.value);
      if (sc) sc.departments.forEach(function (d) {
        deptSel.appendChild(el("option", { value: d.id, selected: d.id === selDept }, d.name));
      });
    }
    fillDept();
    schoolSel.addEventListener("change", function () { selDept = ""; fillDept(); updateEntry(); });
    deptSel.addEventListener("change", updateEntry);

    var gradeSel = el("select", { id: "f-grade" }, [el("option", { value: "" }, "\u8acb\u9078\u64c7")].concat(
      [1,2,3,4].map(function (g) { return el("option", { value: String(g), selected: String(g) === String(selGrade) }, g + " \u5e74\u7d1a"); })
    ));
    gradeSel.addEventListener("change", updateEntry);

    var semWrap = el("fieldset", null, [
      el("legend", null, "\u76ee\u524d\u5b78\u671f"),
      radio("f-sem", "1", "\u4e0a\u5b78\u671f", String(selSem) === "1"),
      radio("f-sem", "2", "\u4e0b\u5b78\u671f", String(selSem) === "2")
    ]);

    var entryInfo = el("p", { class: "muted", id: "entry-info" });
    function updateEntry() {
      var g = parseInt(gradeSel.value, 10);
      if (g) {
        var ay = calcAcademicYear(new Date());
        entryInfo.textContent = "\u63a8\u7b97\u5165\u5b78\u5b78\u5e74\uff1a" + calcEntryYear(ay, g);
      } else entryInfo.textContent = "";
    }
    updateEntry();

    var err = el("div", { id: "s1-err", "aria-live": "polite" });

    var nextBtn = el("button", { class: "primary", type: "button", onclick: function () { submitStep1(schoolSel, deptSel, gradeSel, err); } }, "\u4e0b\u4e00\u6b65");

    card.appendChild(el("div", { class: "row" }, [
      el("div", { class: "col" }, [el("label", { for: "f-school" }, "\u5b78\u6821"), schoolSel]),
      el("div", { class: "col" }, [el("label", { for: "f-dept" }, "\u7cfb\u6240"), deptSel]),
      el("div", { class: "col" }, [el("label", { for: "f-grade" }, "\u5e74\u7d1a"), gradeSel]),
      el("div", { class: "col" }, [semWrap])
    ]));
    card.appendChild(entryInfo);
    card.appendChild(err);
    card.appendChild(nextBtn);
    sec.appendChild(card);
  }

  function radio(name, value, label, checked) {
    var id = name + "-" + value;
    return el("span", { style: "display:inline-flex;align-items:center;gap:6px;margin-right:16px" }, [
      el("input", { type: "radio", name: name, id: id, value: value, checked: checked ? true : null }),
      el("label", { for: id, style: "display:inline;font-weight:400" }, label)
    ]);
  }

  function submitStep1(schoolSel, deptSel, gradeSel, errBox) {
    clear(errBox);
    var schoolId = schoolSel.value, deptId = deptSel.value, grade = parseInt(gradeSel.value, 10);
    var semEl = $$("input[name=f-sem]").filter(function (r) { return r.checked; })[0];
    var semester = semEl ? parseInt(semEl.value, 10) : null;
    if (!schoolId || !deptId || !grade || !semester) {
      errBox.appendChild(el("div", { class: "msg error", role: "alert" }, "\u2716 \u8acb\u5b8c\u6574\u9078\u64c7\u5b78\u6821\u3001\u7cfb\u6240\u3001\u5e74\u7d1a\u8207\u5b78\u671f\u3002"));
      return;
    }
    var school = getSchool(schoolId);
    var dept = getDept(school, deptId);
    var ay = calcAcademicYear(new Date());
    var entryYear = calcEntryYear(ay, grade);
    var picked = pickCurriculum(dept, entryYear);
    if (!picked) {
      errBox.appendChild(el("div", { class: "msg error", role: "alert" }, "\u6b64\u7cfb\u6240\u8cc7\u6599\u5c1a\u672a\u5efa\u7f6e\uff0c\u8acb\u6539\u9078\u5176\u4ed6\u7cfb\u6240\u3002"));
      return;
    }
    var currentTerm = grade + "-" + semester;
    var state = Store.get();
    var changedKey = state.profile && (state.profile.schoolId !== schoolId || state.profile.deptId !== deptId || state.profile.grade !== grade || state.profile.semester !== semester);
    var hasLater = state.requirements || (state.history && state.history.items.length) || (state.plan && state.plan.items.length);

    function apply() {
      Store.set(function (s) {
        s.profile = { schoolId: schoolId, deptId: deptId, grade: grade, semester: semester, entryYear: entryYear };
        s.curriculum = { usedYear: picked.usedYear, fallback: picked.fallback };
        if (changedKey) { s.requirements = null; s.history = { items: [], confirmed: false }; s.plan = { term: null, items: [], submitted: false }; }
        s.plan.term = currentTerm;
        s.ui.step = 2;
      });
      render();
      $("#step-2").focus();
    }
    if (changedKey && hasLater) {
      confirmDialog("\u8b8a\u66f4\u57fa\u672c\u8cc7\u6599\u5c07\u6e05\u9664\u5f8c\u7e8c\u6b65\u9a5f\u8cc7\u6599\uff0c\u662f\u5426\u7e7c\u7e8c\uff1f").then(function (ok) { if (ok) apply(); });
    } else {
      apply();
    }
  }

  // ---------- Step 2 ----------
  function seedCurriculum(state) {
    var school = getSchool(state.profile.schoolId);
    var dept = getDept(school, state.profile.deptId);
    return dept.curricula[String(state.curriculum.usedYear)];
  }

  function renderStep2() {
    var sec = $("#step-2");
    clear(sec);
    var state = Store.get();
    if (!state.profile) return;
    var school = getSchool(state.profile.schoolId);
    var dept = getDept(school, state.profile.deptId);
    var seedCu = seedCurriculum(state);

    // 初始化 requirements（若尚未確認且不存在，從 seed 複製）
    if (!state.requirements) {
      Store.set(function (s) {
        s.requirements = {
          totalCredits: seedCu.totalCredits,
          creditLimits: { min: seedCu.creditLimits.min, max: seedCu.creditLimits.max },
          groups: seedCu.groups.map(function (g) { return { id: g.id, name: g.name, minCredits: g.minCredits }; }),
          peRequirements: seedCu.peRequirements ? { freshman: seedCu.peRequirements.freshman, interest: seedCu.peRequirements.interest } : null,
          edited: false, confirmed: false
        };
      });
      state = Store.get();
    }
    var req = state.requirements;

    var card = el("div", { class: "card" });
    card.appendChild(sectionHeading("step-2-h", "\u6b65\u9a5f 2\uff1a\u7562\u696d\u9580\u6abb\u78ba\u8a8d"));
    card.appendChild(el("p", { class: "muted" },
      school.name + "\uff0f" + dept.name + "\uff0f" + state.profile.grade + " \u5e74\u7d1a\uff0f\u5165\u5b78\u5b78\u5e74 " + state.profile.entryYear + "\uff0f\u63a1\u7528\u7248\u672c " + state.curriculum.usedYear + "\uff08" + seedCu.source + "\u3001\u66f4\u65b0 " + seedCu.updatedAt + "\uff09"));

    if (state.curriculum.fallback) {
      card.appendChild(el("div", { class: "msg warn banner", role: "alert" },
        "\u26a0 \u627e\u4e0d\u5230 " + state.profile.entryYear + " \u5b78\u5e74\u5ea6\u5165\u5b78\u7684\u898f\u5b9a\uff0c\u66ab\u4ee5 " + state.curriculum.usedYear + " \u5b78\u5e74\u5ea6\u7248\u672c\u4ee3\u66ff\uff0c\u8acb\u52d9\u5fc5\u6838\u5c0d\u3002"));
    }

    var liveErr = el("div", { id: "s2-check", "aria-live": "polite" });

    function numInput(id, value, onchange) {
      var inp = el("input", { type: "number", min: "0", max: "300", step: "1", id: id, value: String(value) });
      inp.addEventListener("input", onchange);
      return inp;
    }

    function recomputeCheck() {

  // ---------- render dispatcher ----------
  function render() {
    var state = Store.get();
    renderStepper();
    var step = state.ui.step;
    [1,2,3,4].forEach(function (n) { $("#step-" + n).hidden = (n !== step); });
    $("#summary").hidden = (step !== 5);

  // ============================================================
  // 7. Self-tests (?selftest=1)
  // ============================================================
  function runSelfTests() {
    var results = [];
    function check(id, desc, actual, expected) {
      var pass = JSON.stringify(actual) === JSON.stringify(expected);
      results.push({ id: id, desc: desc, pass: pass, actual: JSON.stringify(actual), expected: JSON.stringify(expected) });
    }
    function checkFn(id, desc, pass, note) {
      results.push({ id: id, desc: desc, pass: !!pass, actual: note || "", expected: "" });
    }

    var school = getSchool("demo-univ");
    var dept = getDept(school, "cs");
    var ee = getDept(school, "ee");
    var cs113 = dept.curricula["113"];
    var courses = school.courses;

    // T1
    check("T1", "termIndex", [termIndex("1-1"), termIndex("3-1"), termIndex("4-2")], [0, 4, 7]);
    // T2
    check("T2", "termsBefore(3-1)", termsBefore("3-1"), ["1-1", "1-2", "2-1", "2-2"]);
    // T3
    check("T3", "calcAcademicYear", [calcAcademicYear(new Date(2026, 9, 16)), calcAcademicYear(new Date(2027, 2, 1))], [115, 115]);
    // T4
    check("T4", "calcEntryYear(115,3)", calcEntryYear(115, 3), 113);
    // T5
    var p5 = pickCurriculum(dept, 113);
    check("T5", "pickCurriculum cs 113", [p5.usedYear, p5.fallback], [113, false]);
    // T6
    var p6a = pickCurriculum(dept, 115), p6b = pickCurriculum(dept, 112);
    check("T6", "pickCurriculum cs 115/112", [p6a.usedYear, p6a.fallback, p6b.usedYear, p6b.fallback], [113, true, 113, true]);
    // T7
    check("T7", "pickCurriculum ee 113", pickCurriculum(ee, 113), null);
    // T8
    var hist = buildAutoHistory(cs113, courses, "3-1");
    var t8credits = hist.reduce(function (a, h) { return a + h.credits; }, 0);
    check("T8", "buildAutoHistory 3-1 count/credits", [hist.length, t8credits], [15, 43]);
    // T9
    var req = { totalCredits: cs113.totalCredits, creditLimits: cs113.creditLimits, groups: cs113.groups };
    var prog9 = computeProgress(req, hist);
    check("T9", "computeProgress gaps", [prog9.byGroup.required.earned, prog9.byGroup.required.gap, prog9.byGroup.elective.gap, prog9.byGroup.general.gap, prog9.byGroup.free.gap, prog9.totalGap], [43, 16, 30, 18, 21, 85]);
    // T10 系選修已得 33 (min 30)
    var hist10 = hist.concat([
      { code: "X1", name: "x1", credits: 30, category: "elective", status: "passed" },
      { code: "X2", name: "x2", credits: 3, category: "elective", status: "passed" }
    ]);
    var prog10 = computeProgress(req, hist10);
    check("T10", "elective overflow", [prog10.byGroup.elective.effective, prog10.byGroup.free.effective], [30, 3]);
    // T11 conflict CS301/CS351
    var cs301 = getCourse(school, "CS301"), cs351 = getCourse(school, "CS351");
    var cf11 = findConflicts([cs301, cs351]);
    check("T11", "findConflicts CS301/CS351", [cf11.length, cf11[0] ? cf11[0].slots.sort() : []], [1, ["Mon-5", "Mon-6"]]);
    // T12 validatePlan CS301/302/303 (9), history=T8
    function planOf(codes) { return { items: codes.map(function (c) { var x = getCourse(school, c); return { code: x.code, name: x.name, credits: x.credits, category: x.category, slots: x.slots.slice() }; }) }; }
    var res12 = validatePlan(planOf(["CS301", "CS302", "CS303"]), { items: hist }, req, 1, courses);
    checkFn("T12", "no errors + V5 warning", res12.errors.length === 0 && res12.warnings.length === 1 && res12.warnings[0].indexOf("\u4f4e\u65bc\u4e0b\u9650") !== -1, "errors=" + res12.errors.length + " warn=" + res12.warnings.length);
    // T13 remove CS201 -> V2 CS301 需先修 CS201
    var hist13 = hist.filter(function (h) { return h.code !== "CS201"; });
    var res13 = validatePlan(planOf(["CS301", "CS302", "CS303"]), { items: hist13 }, req, 1, courses);
    checkFn("T13", "V2 prereq CS201", res13.errors.some(function (m) { return m.indexOf("CS201") !== -1 && m.indexOf("\u9700\u5148\u4fee") !== -1; }), res13.errors.join(" | "));
    // T14 buildAutoPlan 3-1
    var plan14 = buildAutoPlan(cs113, courses, "3-1", hist);
    check("T14", "buildAutoPlan 3-1 codes", plan14.map(function (x) { return x.code; }), ["CS301", "CS302", "CS303"]);
    // T15 add passed CS201 -> V3
    var plan15 = planOf(["CS301", "CS302", "CS303"]);
    plan15.items.push({ code: "CS201", name: getCourse(school, "CS201").name, credits: 3, category: "required", slots: getCourse(school, "CS201").slots.slice() });
    var res15 = validatePlan(plan15, { items: hist }, req, 1, courses);
    checkFn("T15", "V3 already-taken CS201", res15.errors.some(function (m) { return m.indexOf("\u5df2\u4fee\u904e") !== -1; }), res15.errors.join(" | "));
    // T16 GE104 (semesters [2]) in semester 1 -> V6
    var plan16 = { items: [{ code: "GE104", name: getCourse(school, "GE104").name, credits: 2, category: "general", slots: getCourse(school, "GE104").slots.slice() }] };
    var res16 = validatePlan(plan16, { items: hist }, req, 1, courses);
    checkFn("T16", "V6 not offered this semester", res16.errors.some(function (m) { return m.indexOf("\u672c\u5b78\u671f\u672a\u958b\u8ab2") !== -1; }), res16.errors.join(" | "));

    try { console.table(results.map(function (r) { return { id: r.id, pass: r.pass, actual: r.actual, expected: r.expected }; })); } catch (e) {}

    var passCount = results.filter(function (r) { return r.pass; }).length;
    var root = $("#selftest-root");
    var banner = el("div", { class: "selftest-banner" });
    banner.appendChild(el("strong", null, "\u81ea\u6e2c\u7d50\u679c\uff1a" + passCount + " / " + results.length + " \u901a\u904e"));
    var tbl = el("table");
    tbl.appendChild(el("thead", null, el("tr", null, [el("th", null, "ID"), el("th", null, "\u8aaa\u660e"), el("th", null, "\u7d50\u679c"), el("th", null, "actual"), el("th", null, "expected")])));
    var tb = el("tbody");
    results.forEach(function (r) {
      tb.appendChild(el("tr", null, [
        el("td", null, r.id),
        el("td", null, r.desc),
        el("td", { style: "color:" + (r.pass ? "var(--ok)" : "var(--danger)") }, r.pass ? "\u2714 PASS" : "\u2716 FAIL"),
        el("td", null, r.actual),
        el("td", null, r.expected)
      ]));
    });
    tbl.appendChild(tb);
    banner.appendChild(el("div", { class: "scroll-x" }, tbl));
    root.appendChild(banner);
    return results;
  }

  // ============================================================
  // 6. Controllers
  // ============================================================
  function bindToolbar() {
    $("#btn-export").addEventListener("click", doExport);
    $("#btn-reset").addEventListener("click", doReset);
    var fileInput = $("#file-import");
    $("#btn-import").addEventListener("click", function () { fileInput.click(); });
    fileInput.addEventListener("change", function () {
      if (fileInput.files && fileInput.files[0]) doImport(fileInput.files[0]);
      fileInput.value = "";
    });
  }

  function renderFooter() {
    $("#footer-text").textContent = "\u7d50\u679c\u50c5\u4f9b\u53c3\u8003\uff0c\u7562\u696d\u8cc7\u683c\u4ee5\u5b78\u6821\u516c\u544a\u70ba\u6e96\u3002\uff5c" + SEED.meta.disclaimer + "\uff5c\u8cc7\u6599\u66f4\u65b0\uff1a" + SEED.meta.updatedAt;
  }

  // ============================================================
  // 8. Init
  // ============================================================
  // 以目前 seed 的最新資料補正舊存檔中 slots 為空的課程（避免改了 seed 後舊 plan/history 時段遺失）
  function reconcileSlots(state) {
    if (!state || !state.profile) return;
    var school = getSchool(state.profile.schoolId);
    // 建 catalog 查找表：以 code 與 id 皆可找到（補 slots/peKind）
    var catByKey = {};
    if (CATALOG) CATALOG.colleges.forEach(function (col) { col.units.forEach(function (u) { u.courses.forEach(function (c) {
      if (c.id && !catByKey[c.id]) catByKey[c.id] = c;
      if (c.code && !catByKey[c.code]) catByKey[c.code] = c;
    }); }); });
    function fix(items) {
      (items || []).forEach(function (it) {
        // 補時段：優先本系課程庫，其次 catalog
        if (!(it.slots && it.slots.length)) {
          var c = school ? getCourse(school, it.code) : null;
          if (c && c.slots && c.slots.length) it.slots = c.slots.slice();
          else {
            var cc = catByKey[it.section ? (it.code + "-" + it.section) : it.code] || catByKey[it.code];
            if (cc && cc.slots && cc.slots.length) it.slots = cc.slots.slice();
          }
        }
        // 補 peKind（舊存檔的體育課可能沒有）
        if (!it.peKind) {
          var cp = catByKey[it.section ? (it.code + "-" + it.section) : it.code] || catByKey[it.code];
          if (cp && cp.peKind) it.peKind = cp.peKind;
        }
        // 通識課（課號 GS/CC）一律歸為通識學分
        var pre = (it.code || "").slice(0, 2);
        if ((pre === "GS" || pre === "CC") && it.category !== "general") it.category = "general";
        // 語言課(LN)與AI聯盟(TC)一律歸為自由選修
        if ((pre === "LN" || pre === "TC") && it.category !== "free") it.category = "free";
        // 微積分(二) MA1006 歸為自由選修
        if (it.code === "MA1006" && it.category !== "free") it.category = "free";
      });
    }
    if (state.plan) fix(state.plan.items);
    if (state.history) fix(state.history.items);
  }

  function init() {
    try {
      SEED = loadSeed();
      CATALOG = loadCatalog();
    } catch (e) {
      var app = $("#app");
      clear(app);
      app.appendChild(el("div", { class: "msg error", role: "alert" }, "\u8cc7\u6599\u8f09\u5165\u5931\u6557\uff1a" + e.message));
      return;
    }
    renderFooter();
    bindToolbar();

    var loaded = load();
    if (loaded === "incompatible") {
      Store.replace(createInitialState());
      setTimeout(function () { toast("\u820a\u8cc7\u6599\u683c\u5f0f\u4e0d\u76f8\u5bb9\uff0c\u5df2\u91cd\u65b0\u958b\u59cb"); }, 100);
    } else if (loaded) {
      Store.replace(loaded);
    }

    Store.set(function (st) { reconcileSlots(st); });

    if (!storageOK) {
      setTimeout(function () { toast("\u7121\u6cd5\u4f7f\u7528\u700f\u89bd\u5668\u5132\u5b58\uff0c\u8cc7\u6599\u50c5\u4fdd\u7559\u65bc\u672c\u6b21\u700f\u89bd\uff0c\u8acb\u8a18\u5f97\u532f\u51fa\u3002"); }, 200);
    }

    render();

    var params = new URLSearchParams(window.location.search);
    if (params.get("selftest") === "1") {
      try { runSelfTests(); } catch (e) { console.error(e); }
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
  </script>
</body>
